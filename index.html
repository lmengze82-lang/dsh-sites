<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页合集 · 三个版本</title>
<meta name="description" content="同一个需求，三种风格的网站：深色科技、可爱贴纸、旅行手账。">
<meta name="theme-color" content="#FFF8F2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFF8F2'/%3E%3Ccircle cx='24' cy='32' r='9' fill='%23FF8FB1' stroke='%234A3B45' stroke-width='3'/%3E%3Ccircle cx='42' cy='32' r='9' fill='%239FE8CE' stroke='%234A3B45' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --cream:#FFF8F2;--ink:#4A3B45;--ink-soft:#7A676F;
  --pink:#FFB3C7;--pink-2:#FF8FB1;--mint:#9FE8CE;--butter:#FFDF9E;--lav:#CBBDFF;
  --line:3px solid var(--ink);--sh:6px 6px 0 rgba(74,59,69,.18);
  --font:"Fredoka","PingFang SC","Hiragino Sans GB","YouYuan","幼圆","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--cream);color:var(--ink);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;justify-content:center;padding:48px 20px;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px 600px at 8% -5%,#FFE3EC 0%,transparent 62%),
    radial-gradient(520px 520px at 96% 6%,#DFF6EC 0%,transparent 60%),
    radial-gradient(680px 680px at 50% 108%,#FFF0D6 0%,transparent 66%);
}
.wrap{width:min(980px,100%);margin:0 auto}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  border:2.5px solid var(--ink);background:var(--butter);font-size:12.5px;font-weight:500;
  box-shadow:2px 2px 0 rgba(74,59,69,.16);
}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.25;margin:18px 0 0;letter-spacing:.01em}
p.sub{margin:12px 0 0;color:var(--ink-soft);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}
.card{
  display:block;position:relative;text-decoration:none;color:inherit;
  background:#fff;border:var(--line);border-radius:26px;padding:14px 14px 20px;
  box-shadow:var(--sh);transform:rotate(var(--r,0deg));
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
}
.card:nth-child(1){--r:-1.2deg}
.card:nth-child(2){--r:.9deg}
.card:nth-child(3){--r:-.7deg}
.card:hover{transform:rotate(0) translateY(-8px);box-shadow:9px 11px 0 rgba(74,59,69,.2)}
.thumb{
  height:132px;border:2.5px solid var(--ink);border-radius:16px;display:grid;place-items:center;
  font-size:42px;margin-bottom:14px;
}
.card:nth-child(1) .thumb{background:linear-gradient(160deg,#0b0f1a,#1a2340)}
.card:nth-child(2) .thumb{background:linear-gradient(160deg,#FFF2F7,#EFFBF5)}
.card:nth-child(3) .thumb{background:linear-gradient(160deg,#FFF3F7,#E7F6EC)}
.card h2{font-size:17px;font-weight:600;margin:0 0 6px}
.card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.7}
.tag{
  display:inline-block;margin-top:12px;padding:3px 10px;border-radius:999px;border:2px solid rgba(74,59,69,.45);
  font-size:11.5px;background:rgba(255,255,255,.7);
}
footer{margin-top:44px;color:var(--ink-soft);font-size:12.5px;text-align:center}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🎨 同一个需求，三种风格</span>
  <h1>网页合集</h1>
  <p class="sub">从「做个网站」一句话开始，做了三个完全不同的方向。点进去看看。</p>

  <div class="grid">
    <a class="card" href="./showcase/">
      <div class="thumb">🌑</div>
      <h2>深色版 · 能力展台</h2>
      <p>星域粒子、滚动叙事、3D 倾斜卡片。科技感、克制、有点冷。</p>
      <span class="tag">Canvas · 深色</span>
    </a>
    <a class="card" href="./cute/">
      <div class="thumb">🐱</div>
      <h2>可爱版 · 小怪兽</h2>
      <p>奶油糖果色、粗描边贴纸、会眨眼的小怪兽，还有能戳破的泡泡。</p>
      <span class="tag">贴纸风 · 互动</span>
    </a>
    <a class="card" href="./travel/">
      <div class="thumb">📖</div>
      <h2>手账版 · 关西慢行</h2>
      <p>一本手绘旅行日记：京都的鸟居、奈良的小鹿、雨夜的大阪。</p>
      <span class="tag">手绘 SVG · 日记</span>
    </a>
  </div>

  <footer>三个页面都是单文件、零依赖 · 手写 HTML / CSS / SVG</footer>
</div>
</body>
</html>
